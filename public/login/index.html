<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="../geral.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

  <title>ChatDocs | Login</title>
</head>

<body class="col-lg-6 my-3 mx-auto">
  <header>
    <h1 class="text-center display-2 mb-0"><i class="fa-solid fa-comments"></i> ChatDocs</h1>
  </header>

  <main class="w-75 mx-auto">
    <hr>
    <h2 class="display-6 mb-3">Login</h2>

    <form id="form-login">
      <div class="mb-3">
        <label for="input-usuario" class="form-label">Usuário</label>
        <input type="text" class="form-control" id="input-usuario" required>
      </div>
      <div class="mb-3">
        <label for="input-senha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="input-senha" required>
      </div>
      <button type="submit" class="btn btn-primary mb-3">Login</button>
      <p>Não possui usuário? <a href="/cadastro/index.html" class="link-primary">Faça o cadastro</a></p>
  </main>
  <footer class="footer">
    <p class="footer-copy">
      © 2026 <strong>ChatDocs</strong> • Desenvolvido por Fabyola Campos
    </p>

    <div class="footer-socials">
      <a href="https://www.linkedin.com/in/fabyola-campos" target="_blank" aria-label="LinkedIn">
        <i class="fa-brands fa-linkedin-in"></i>
      </a>

      <a href="https://github.com/fabyolafc" target="_blank" aria-label="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>

      <a href="https://www.instagram.com/fabyolacampos" target="_blank" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <script src="/socket.io/socket.io.js"></script>
  <script src="login.js" type="module"></script>
</body>

</html>
